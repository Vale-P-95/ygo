[package]
name = "ygo-cli"
description = "Command-line tools for DuelForge: data download, engine sandbox, benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "duelforge-cli"
path = "src/main.rs"

[dependencies]
ygo-engine = { path = "../ygo-engine" }
ygo-data = { path = "../ygo-data" }
ygo-solver = { path = "../ygo-solver" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
