name: CI

# The private repository has a monthly budget of Actions minutes: pull
# requests run once (not again for the push to their branch) and only the
# jobs of the areas they change; main runs everything after a merge; the
# Windows installer (whose minutes count double) is built on main or when
# asked for.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # Opened (or reopened, or out of draft): not on every push to the branch.
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      installer:
        description: Also build the Windows installer
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      engine: ${{ steps.areas.outputs.engine }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          rust=false
          engine=false
          frontend=false
          if echo "$files" | grep -qE '^(crates/|apps/desktop/src-tauri/|Cargo\.(toml|lock)$|rustfmt\.toml$|vendor/|tests/|\.gitmodules$|\.github/workflows/)'; then rust=true; fi
          if echo "$files" | grep -qE '^(crates/ygo-engine/|vendor/|tests/fixtures/|Cargo\.(toml|lock)$|\.gitmodules$|\.github/workflows/)'; then engine=true; fi
          if echo "$files" | grep -E '^apps/desktop/' | grep -qvE '^apps/desktop/src-tauri/'; then frontend=true; fi
          if echo "$files" | grep -qE '^\.github/workflows/'; then frontend=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  rust:
    name: Engine and CLI (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p ygo-engine -p ygo-data -p ygo-stats -p ygo-solver -p ygo-cli --all-targets -- -D warnings
      # The app backend is otherwise built only with the Windows installer
      # (on main), and a change to the crates can break it.
      - name: App backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
          cargo clippy -p duelforge-desktop --all-targets -- -D warnings
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: game-data-${{ github.run_id }}
          restore-keys: game-data-
      - name: Download card scripts and databases
        run: cargo run --release -p ygo-cli -- fetch-data
      - name: Tests
        run: cargo test -p ygo-engine -p ygo-data -p ygo-stats -p ygo-solver -p ygo-cli
      # Fixed hands of the Invoked test deck with a node budget: the search
      # must still reach its known boards without pointless moves (release
      # only, like the build of fetch-data above; about 2 minutes).
      - name: Search regression tests
        timeout-minutes: 15
        run: cargo test --release -p ygo-solver --test search_regression

  # The app runs on Windows: the engine's memory arenas (VirtualAlloc) and
  # the rest of the engine are tested there too, with the game data.
  engine-windows:
    name: Engine on Windows
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    # A hang in the engine must not hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: game-data-windows-${{ github.run_id }}
          restore-keys: game-data-windows-
      - name: Download card scripts and databases
        run: cargo run --release -p ygo-cli -- fetch-data
      - name: Engine tests
        run: cargo test --release -p ygo-engine

  frontend:
    name: Frontend (TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-installer:
    name: Windows installer
    needs: [rust, frontend]
    if: github.event_name == 'push' || inputs.installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build app and installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DuelForge-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
