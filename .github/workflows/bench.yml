name: Bench

# Compares the combo search of two versions. With bench "banco-quick" or
# "banco-full", on the frozen bench of tests/fixtures/banco-motore
# (scripts/banco.py, rules in docs/plans/regole-motore.md): committed lists,
# so nothing is downloaded, and the verdict of `same` or `judge`. With
# "legacy", on the hands of tests/fixtures/hands/bench.tsv
# (scripts/bench.py) and the lists of today: each hand on one thread
# with a node budget, so the boards do not depend on the runner, and the
# hands split over several runners. Started by hand: one run costs more
# than an hour of Actions minutes. The Master Duel Meta decklists are
# downloaded once per run, so both versions play the same decks; they are
# never committed.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Version before (branch, tag or commit)
        default: main
      head:
        description: Version after (empty for the branch the workflow is started on)
        default: ""
      nodes:
        description: Nodes per hand
        default: "4000"
      shards:
        description: Runners the hands are split over
        default: "6"
      bench:
        description: banco-quick (63 hands), banco-full (193 hands) or legacy (bench.tsv on today's lists)
        default: banco-full
      check:
        description: "For the banco: same (no output may change), judge (the paired rules) or judge-measure (a change to the measure)"
        default: judge

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.side }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'base' && inputs.base || inputs.head || github.ref }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: cargo build --release -p ygo-cli
      - run: |
          mkdir out
          cp target/release/duelforge-cli out/
          git log -1 --format='%h %s' > out/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.side }}
          path: out
          retention-days: 3

  decks:
    name: Decklists
    needs: build
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-head
          path: cli
      - if: inputs.bench == 'legacy'
        run: |
          chmod +x cli/duelforge-cli
          cli/duelforge-cli --data data update-cards
          python3 scripts/mdm_decks.py --out decks --db data/cards.db
      - if: inputs.bench != 'legacy'
        run: mkdir -p decks && touch decks/.none
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: decks
          retention-days: 3
      - id: shards
        run: python3 -c "import json; print('list=' + json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  hands:
    name: Hands ${{ matrix.shard }}
    needs: decks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.decks.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Game data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: game-data-bench
          restore-keys: game-data-
      - run: |
          chmod +x art/cli-base/duelforge-cli art/cli-head/duelforge-cli
          art/cli-head/duelforge-cli --data data fetch-data
      - name: Search (banco)
        if: inputs.bench != 'legacy'
        run: |
          set="${{ inputs.bench }}"
          python3 scripts/banco.py run out --old art/cli-base/duelforge-cli --new art/cli-head/duelforge-cli \
            --set "${set#banco-}" --jobs 2 --shard "${{ matrix.shard }}/${{ inputs.shards }}" \
            ${{ inputs.check == 'judge-measure' && '--measure-cli art/cli-head/duelforge-cli' || '' }}
      - name: Search
        if: inputs.bench == 'legacy'
        run: |
          shard="${{ matrix.shard }}/${{ inputs.shards }}"
          python3 scripts/bench.py out/base --decks art/decks --cli art/cli-base/duelforge-cli --nodes ${{ inputs.nodes }} --jobs 2 --shard "$shard"
          python3 scripts/bench.py out/head --decks art/decks --cli art/cli-head/duelforge-cli --nodes ${{ inputs.nodes }} --jobs 2 --shard "$shard"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: out
          retention-days: 7

  report:
    name: Report
    needs: hands
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Verdict (banco)
        if: inputs.bench != 'legacy'
        run: |
          mkdir banco
          for d in art/results-*; do cp -r "$d"/. banco/; done
          # The boards were measured again on the runners (run --measure-cli).
          case "${{ inputs.check }}" in
            same) python3 scripts/banco.py same banco || status=$? ;;
            judge-measure) python3 scripts/banco.py judge banco --measure-cli art/cli-head/duelforge-cli || status=$? ;;
            *) python3 scripts/banco.py judge banco || status=$? ;;
          esac
          { echo "## Banco $(cat art/cli-base/version.txt) → $(cat art/cli-head/version.txt)"; echo '```'; cat banco/summary.txt; echo '```'; } | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - if: inputs.bench == 'legacy'
        run: |
          title="Bench: $(cat art/cli-base/version.txt) → $(cat art/cli-head/version.txt), ${{ inputs.nodes }} nodi"
          python3 scripts/bench_compare.py --title "$title" --base art/results-*/base/results.json --head art/results-*/head/results.json | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md
          retention-days: 30
